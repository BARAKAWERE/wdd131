<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temple Album | Baraka Shadrack Were</title>
  <meta name="description" content="A responsive picture album of temples with a hamburger menu and a CSS Grid layout.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/temples.css">
  <link rel="stylesheet" href="styles/temples-large.css" media="(min-width: 700px)">
  <script src="scripts/temples.js" defer></script>
</head>
<body>
  <header>
    <div class="header-bar">
      <p class="site-title">Temple Album</p>
      <button id="menu-button" class="menu-button" type="button" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="primary-nav">&#9776;</button>
    </div>
    <nav id="primary-nav" aria-label="Main navigation">
      <ul>
        <li><a href="#" class="active" aria-current="page">Home</a></li>
        <li><a href="#">Old</a></li>
        <li><a href="#">New</a></li>
        <li><a href="#">Large</a></li>
        <li><a href="#">Small</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Home</h1>
    <section class="gallery" aria-label="Temple pictures">

      <figure>
        <img src="images/temple-placeholder.webp" alt="Temple five" width="640" height="420" loading="lazy">

      </figure>
      <figure>

      <figure>
        <img src="images/temple-placeholder.webp" alt="Temple seven" width="640" height="420" loading="lazy">
        <figcaption>Temple Seven</figcaption>
      </figure>
      <figure>

    </section>
  </main>

  <footer>
    <p>&copy; <span id="currentyear"></span> | Baraka Shadrack Were | Arusha, Tanzania</p>
    <p>Last Modification: <span id="lastModified"></span></p>
  </footer>
</body>
</html>
